<p class="notice">無関係な相手への大量DMや、宣伝禁止のコミュニティへの投稿は避けてください。実際に使ったことのない人の口コミを装わないでください。Instagramの通常投稿には画像・動画が必要で、このページはキャプション文章のみです。</p>

</article></main><script>
document.querySelectorAll('[data-copy]').forEach(button=>button.addEventListener('click',async()=>{
 const id=button.dataset.copy,field=document.getElementById(id),status=document.getElementById('m'+id.slice(1));
 try{await navigator.clipboard.writeText(field.value);status.textContent='コピーしました。内容を確認してから投稿してください。'}
 catch{field.focus();field.select();status.textContent='文章を選択しました。Ctrl+Cなどでコピーしてください。'}
}));
</script></body></html>
